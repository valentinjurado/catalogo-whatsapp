<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#EA580C" />

    <!--
      PRIVACIDAD Y SEGURIDAD (parte que se puede declarar desde el HTML):
      · no-referrer: el navegador NO manda la dirección de esta página a otros
        sitios, así el link de WhatsApp (que lleva el mensaje del pedido) nunca
        viaja como "referer".
      · CSP: solo se permite cargar código y estilos propios, imágenes por https
        y conexiones al Google Sheet configurado. Sin scripts de terceros,
        sin analítica, sin píxeles: no hay a quién filtrarle datos.
      Las cabeceras que NO se pueden poner desde el HTML (X-Frame-Options,
      frame-ancestors, HSTS, Permissions-Policy) van en vercel.json y en
      public/_headers para Netlify/Cloudflare Pages.
    -->
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://docs.google.com https://*.googleusercontent.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />

    <!--
      Los %DATOS% se reemplazan en el build con los valores de src/config/negocio.js
      (ver el plugin datosDelNegocioEnElHtml en vite.config.js).
    -->
    <title>%NEGOCIO% | Pedidos por WhatsApp</title>
    <meta name="description" content="%DESCRIPCION%" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%NEGOCIO% | Pedidos por WhatsApp" />
    <meta property="og:description" content="%ESLOGAN%. Pedí online y confirmá por WhatsApp." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <noscript>
      <div
        style="max-width: 34rem; margin: 3rem auto; padding: 1.5rem; font-family: system-ui, sans-serif; line-height: 1.6; color: #1e293b; border: 1px solid #e2e8f0; border-radius: 1rem"
      >
        <h1 style="font-size: 1.25rem; margin: 0 0 0.5rem">%NEGOCIO%</h1>
        <p style="margin: 0">
          No pudimos mostrar el menú porque tu navegador tiene desactivada una función que
          necesitamos para armarlo. Se activa en las opciones del navegador (Configuración →
          Privacidad y seguridad).
        </p>
        <p style="margin: 0.75rem 0 0">
          O más simple: pedinos por WhatsApp y te tomamos el pedido igual.
        </p>
        <p style="margin: 0.75rem 0 0; font-size: 1.25rem">
          <a href="%WHATSAPP_LINK%" style="color: #ea580c; font-weight: 700; text-decoration: none">
            WhatsApp: %WHATSAPP%
          </a>
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
